services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - darts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  silero:
    build: ./tools/silero
    environment:
      SILERO_MODEL_PATH: /app/v5_5_ru.pt
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      silero:
        condition: service_healthy
    environment:
      ConnectionStrings__Darts: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Speech__Enabled: "true"
      Speech__BaseUrl: http://silero:8765
      Speech__Speaker: eugene
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  darts-data:
